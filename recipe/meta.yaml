{% set name = "dioptas" %}
{% set version = "0.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/dioptas-{{ version }}.tar.gz
  sha256: fb3669991c8669154baeb3480d08f6272d56b8002291ba11ba92160b3733944b

build:
  noarch: python
  entry_points:
    - dioptas = dioptas:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core
    - poetry-dynamic-versioning
  run:
    - python >={{ python_min }}
    - h5py
    - hdf5plugin
    - lmfit
    - pandas
    - psutil
    - pyqt6 >=6.8
    - pyfai >=2025.12.1
    - pyqtgraph
    - pyshortcuts
    - qtpy
    - scikit-image
    - pyopengl
    - xypattern >=1.2.4,<2.0
    - numpy >=2.0,<3.0
    - scipy
    - numexpr
    - qt-material
    - bitshuffle >=0.5.1
    - xraydb >=4.5.8
    - psygnal >=0.15.1,<0.16
    # Missing dependencies:
    # - peritheos
    # - phasesmith
    # Optional
    # - extra-data
    # - pyopengl-accelerate
    # dioptas_batch:
    # - sharedmem

test:
  requires:
    - python {{ python_min }}
  imports:
    - dioptas

app:
  entry: dioptas
  summary: "Dioptas"
  icon: icon.png

about:
  home: https://github.com/Dioptas/Dioptas
  license: MIT
  license_file: LICENSE.txt
  summary: GUI program for reduction and exploration of 2D X-ray diffraction data
  doc_url: https://dioptas.readthedocs.io/en/stable/
  dev_url: https://github.com/dioptas/dioptas

extra:
  recipe-maintainers:
    - CPrescher
    - t20100
